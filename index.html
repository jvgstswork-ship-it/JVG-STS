<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JVG STS - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white p-6 rounded-2xl shadow-xl border border-red-100">
        <div class="text-center mb-6">
            <div class="w-16 h-16 bg-red-600 text-white rounded-full flex items-center justify-center mx-auto mb-2 text-xl font-black shadow">STS</div>
            <h1 class="text-xl font-black text-red-600">JVG SmartTech Suvidha</h1>
            <p class="text-xs text-gray-500">गौरा दुबे, सिसवा बाज़ार, महराजगंज (UP)</p>
        </div>

        <form onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-gray-700 uppercase mb-1">रोल चुनें</label>
                <select id="login-role" class="w-full p-3 border rounded-xl text-sm font-semibold bg-white">
                    <option value="owner">मालिक (Owner)</option>
                    <option value="staff">स्टाफ (Staff Operator)</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-700 uppercase mb-1">मोबाइल नंबर</label>
                <input type="tel" id="login-id" placeholder="मोबाइल नंबर दर्ज करें" required class="w-full p-3 border rounded-xl text-sm font-semibold">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-700 uppercase mb-1">पासवर्ड</label>
                <input type="password" id="login-pass" placeholder="पासवर्ड दर्ज करें" required class="w-full p-3 border rounded-xl text-sm font-semibold">
            </div>
            <div class="flex justify-end items-center text-xs">
                <button type="button" onclick="forgotPass()" class="text-red-600 font-bold hover:underline">पासवर्ड भूल गए?</button>
            </div>
            <button type="submit" class="w-full py-3.5 bg-red-600 hover:bg-red-700 text-white font-black rounded-xl shadow text-sm">लॉगिन करें</button>
        </form>
    </div>

    <script>
        // ऑटो-सेशन चेक (रात 12 से सुबह 4 बजे रीसेट)
        window.onload = function() {
            const currentHour = new Date().getHours();

            if (currentHour >= 0 && currentHour < 4) {
                localStorage.removeItem('jvg_session_active');
                localStorage.removeItem('jvg_user_role');
                localStorage.removeItem('jvg_user_name');
                return;
            }

            const savedSession = localStorage.getItem('jvg_session_active');
            if (savedSession === 'true') {
                window.location.href = 'biling.html';
            }
        };

        function forgotPass() {
            const role = document.getElementById('login-role').value;
            if(role === 'owner') {
                alert('ओनर (मालिक) पासवर्ड आपका रजिस्टर्ड मोबाइल नंबर है।');
            } else {
                alert('स्टाफ पासवर्ड के लिए दुकान मालिक से संपर्क करें।');
            }
        }

        function handleLogin(e) {
            e.preventDefault();
            const role = document.getElementById('login-role').value;
            const phone = document.getElementById('login-id').value.trim();
            const pass = document.getElementById('login-pass').value.trim();
            let staffDb = JSON.parse(localStorage.getItem('jvg_staff_db')) || {};

            if (role === 'owner') {
                if (phone === '7518314203' && pass === '7518314203') {
                    localStorage.setItem('jvg_session_active', 'true');
                    localStorage.setItem('jvg_user_role', 'owner');
                    localStorage.setItem('jvg_user_name', 'जगन्नाथ विश्वकर्मा (मालिक)');
                    window.location.href = 'biling.html';
                } else {
                    alert('गलत ओनर मोबाइल नंबर या पासवर्ड!');
                }
            } else {
                if (staffDb[phone] && staffDb[phone].pass === pass) {
                    localStorage.setItem('jvg_session_active', 'true');
                    localStorage.setItem('jvg_user_role', 'staff');
                    localStorage.setItem('jvg_user_name', staffDb[phone].name + ' (स्टाफ)');
                    window.location.href = 'biling.html';
                } else {
                    alert('गलत स्टाफ मोबाइल नंबर या पासवर्ड!');
                }
            }
        }
    </script>
</body>
</html>
