<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JVG STS - Secure Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .hidden-section { display: none !important; }
    </style>
</head>
<body class="bg-gradient-to-br from-red-700 via-red-800 to-black min-h-screen flex items-center justify-center p-4 font-sans">
    <div class="max-w-sm w-full bg-white/95 backdrop-blur-md p-6 rounded-3xl shadow-2xl space-y-5 border border-white/20">
        
        <!-- Header -->
        <div class="text-center space-y-1">
            <div class="w-14 h-14 bg-red-600 text-white rounded-2xl flex items-center justify-center font-black text-xl mx-auto shadow-lg border-2 border-white">
                JVG
            </div>
            <h1 class="text-lg font-black text-gray-900 pt-2">JVG SmartTech Suvidha</h1>
            <p class="text-xs text-gray-500 font-bold">सुरक्षित बिलिंग एवं काउंटर पोर्टल</p>
        </div>

        <!-- Login Form -->
        <form id="login-form" onsubmit="handleSecureLogin(event)" autocomplete="off" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">मोबाइल नंबर / Login ID</label>
                <input type="tel" id="login-phone" placeholder="अपना मोबाइल नंबर दर्ज करें" autocomplete="new-password" required class="w-full p-3 border border-gray-300 rounded-xl text-xs font-semibold focus:ring-2 focus:ring-red-500 focus:outline-none">
            </div>

            <div>
                <div class="flex justify-between items-center mb-1">
                    <label class="block text-xs font-bold text-gray-700">पासवर्ड (Password)</label>
                    <button type="button" onclick="showForgotModal()" class="text-[11px] font-bold text-red-600 hover:underline">
                        पासवर्ड भूल गए?
                    </button>
                </div>
                <input type="password" id="login-pass" placeholder="••••••••" autocomplete="new-password" required class="w-full p-3 border border-gray-300 rounded-xl text-xs font-semibold focus:ring-2 focus:ring-red-500 focus:outline-none">
            </div>

            <button type="submit" class="w-full py-3.5 bg-red-600 hover:bg-red-700 text-white font-black rounded-xl text-xs shadow-xl transition active:scale-95 flex items-center justify-center gap-1">
                🔒 पोर्टल में लॉगिन करें
            </button>
        </form>

        <div class="text-center pt-2 border-t">
            <p class="text-[10px] text-gray-400 font-bold">JVG STS Secure POS System v2.0</p>
        </div>
    </div>

    <!-- FORGOT PASSWORD MODAL -->
    <div id="forgot-modal" class="hidden-section fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50">
        <div class="bg-white w-full max-w-sm rounded-3xl p-6 text-center space-y-4 shadow-2xl">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 class="font-black text-sm text-gray-800">🔑 पासवर्ड रीसेट सहायता</h3>
                <button type="button" onclick="closeForgotModal()" class="text-gray-400 font-bold">✕</button>
            </div>

            <div class="text-left space-y-3 text-xs">
                <p class="text-gray-600 font-semibold">
                    यदि आप पासवर्ड भूल गए हैं या आपका स्टाफ लॉगिन नहीं हो रहा है, तो मालिक <b>जगन्नाथ विश्वकर्मा</b> से संपर्क करें:
                </p>

                <div class="bg-red-50 p-3 rounded-2xl border border-red-200 text-center font-bold text-red-700">
                    📞 हेल्पलाइन: 7518314203
                </div>

                <a href="https://api.whatsapp.com/send?phone=917518314203&text=नमस्ते%20जगन्नाथ%20जी,%20लॉगिन%20पासवर्ड%20रीसेट%20करना%20है।" target="_blank" class="block w-full text-center py-3 bg-green-600 hover:bg-green-700 text-white font-black rounded-xl shadow">
                    💬 मालिक को व्हाट्सएप संदेश भेजें
                </a>
            </div>

            <button type="button" onclick="closeForgotModal()" class="w-full py-2 bg-gray-200 font-bold text-xs rounded-xl">
                वापस आएं
            </button>
        </div>
    </div>

    <script>
        window.onload = function() {
            if (!localStorage.getItem('jvg_owner_phone')) {
                localStorage.setItem('jvg_owner_phone', '7518314203');
                localStorage.setItem('jvg_owner_pass', '1234');
            }
        };

        function showForgotModal() {
            document.getElementById('forgot-modal').classList.remove('hidden-section');
        }

        function closeForgotModal() {
            document.getElementById('forgot-modal').classList.add('hidden-section');
        }

        function handleSecureLogin(e) {
            e.preventDefault();
            let phone = document.getElementById('login-phone').value.trim();
            let pass = document.getElementById('login-pass').value.trim();

            let ownerPhone = localStorage.getItem('jvg_owner_phone') || '7518314203';
            let ownerPass = localStorage.getItem('jvg_owner_pass') || '1234';

            // 1. Owner Login
            if (phone === ownerPhone && pass === ownerPass) {
                localStorage.setItem('jvg_session_active', 'true');
                localStorage.setItem('jvg_user_name', 'जगन्नाथ विश्वकर्मा (मालिक)');
                localStorage.setItem('jvg_user_role', 'owner');
                window.location.replace('biling.html');
                return;
            }

            // 2. Staff Login
            let staffList = [];
            try {
                staffList = JSON.parse(localStorage.getItem('jvg_staff_list')) || [];
            } catch(err) { staffList = []; }

            let foundStaff = staffList.find(s => s.phone === phone && s.pass === pass);

            if (foundStaff) {
                localStorage.setItem('jvg_session_active', 'true');
                localStorage.setItem('jvg_user_name', foundStaff.name + ' (स्टाफ)');
                localStorage.setItem('jvg_user_role', 'staff');
                window.location.replace('biling.html');
                return;
            }

            alert("❌ गलत मोबाइल नंबर या पासवर्ड! कृपया सही विवरण दर्ज करें।");
        }
    </script>
</body>
</html>
