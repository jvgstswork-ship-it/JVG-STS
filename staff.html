<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JVG STS - Staff Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4">
    <div class="max-w-md mx-auto bg-white p-6 rounded-2xl shadow border space-y-4">
        <div class="flex justify-between items-center border-b pb-2">
            <h3 class="font-black text-red-600 text-sm">👤 स्टाफ मैनेजमेंट (नया स्टाफ जोड़ें)</h3>
            <a href="billing.html" class="text-xs bg-gray-200 px-3 py-1 rounded font-bold">← वापस जाएं</a>
        </div>

        <div class="space-y-3 text-xs">
            <div>
                <label class="block font-bold mb-1">स्टाफ का नाम</label>
                <input type="text" id="staff-name" placeholder="उदा. राहुल कुमार" class="w-full p-2.5 border rounded-xl">
            </div>
            <div>
                <label class="block font-bold mb-1">मोबाइल नंबर (Login ID)</label>
                <input type="tel" id="staff-phone" placeholder="उदा. 9876543210" class="w-full p-2.5 border rounded-xl">
            </div>
            <div>
                <label class="block font-bold mb-1">पासवर्ड</label>
                <input type="password" id="staff-pass" placeholder="पासवर्ड (XXXX)" class="w-full p-2.5 border rounded-xl">
            </div>
            <button onclick="registerStaff()" class="w-full py-3 bg-yellow-500 hover:bg-yellow-400 text-gray-950 font-black rounded-xl shadow">+ नया स्टाफ रजिस्टर करें</button>
        </div>

        <div class="border-t pt-3">
            <p class="font-bold text-xs text-gray-700 mb-2">रजिस्टर्ड स्टाफ लिस्ट:</p>
            <div id="staff-list-box" class="space-y-1 text-xs text-gray-600"></div>
        </div>
    </div>

    <script>
        window.onload = function() {
            if(localStorage.getItem('jvg_user_role') !== 'owner') {
                alert('यह पेज केवल मालिक (Owner) के लिए है!');
                window.location.href = 'billing.html';
            }
            renderStaffList();
        }

        function registerStaff() {
            let name = document.getElementById('staff-name').value;
            let phone = document.getElementById('staff-phone').value;
            let pass = document.getElementById('staff-pass').value;

            if(!name || !phone || !pass) { alert('कृपया सभी जानकारी भरें!'); return; }

            let staffDb = JSON.parse(localStorage.getItem('jvg_staff_db')) || {};
            staffDb[phone] = { name: name, pass: pass };
            localStorage.setItem('jvg_staff_db', JSON.stringify(staffDb));

            alert(`स्टाफ '${name}' सफलता पूर्वक जुड़ गया!`);
            document.getElementById('staff-name').value = '';
            document.getElementById('staff-phone').value = '';
            document.getElementById('staff-pass').value = '';
            renderStaffList();
        }

        function renderStaffList() {
            let staffDb = JSON.parse(localStorage.getItem('jvg_staff_db')) || {};
            let box = document.getElementById('staff-list-box');
            let keys = Object.keys(staffDb);
            if(keys.length === 0) { box.innerHTML = '<p class="text-gray-400">कोई स्टाफ रजिस्टर नहीं है।</p>'; return; }
            box.innerHTML = '';
            keys.forEach(k => {
                box.innerHTML += `<div class="bg-gray-50 p-2 rounded border flex justify-between items-center">
                    <span><b>${staffDb[k].name}</b> (${k})</span>
                    <span class="text-green-600 font-bold">एक्टिव</span>
                </div>`;
            });
        }
    </script>
</body>
</html>
