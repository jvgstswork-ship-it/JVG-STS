<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JVG STS - Product Upload</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        .hidden-section { display: none !important; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-4 font-sans">
    <div class="max-w-md mx-auto bg-white p-5 rounded-3xl shadow-xl border space-y-4">
        
        <div class="flex justify-between items-center border-b pb-3">
            <h2 class="font-black text-red-600 text-sm flex items-center gap-1">
                <span>📦 नया प्रोडक्ट अपलोड करें</span>
            </h2>
            <a href="biling.html" class="bg-red-600 text-white font-bold text-xs px-3 py-1.5 rounded-xl shadow">
                🏠 होम (बिलिंग पर जाएं)
            </a>
        </div>

        <form id="upload-form" onsubmit="saveProduct(event)" class="space-y-3">
            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">सामान का नाम</label>
                <input type="text" id="p-name" placeholder="उदा. boAt Neckband" required class="w-full p-2.5 border rounded-xl text-xs font-semibold">
            </div>

            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">मॉडल नंबर</label>
                    <input type="text" id="p-model" placeholder="उदा. BT-101" required class="w-full p-2.5 border rounded-xl text-xs font-semibold">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">बिक्री रेट (₹)</label>
                    <input type="number" id="p-price" placeholder="650" required class="w-full p-2.5 border rounded-xl text-xs font-semibold">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">बारकोड नंबर</label>
                <div class="flex gap-2">
                    <input type="text" id="p-code" placeholder="उदा. 890123456" required class="flex-1 p-2.5 border rounded-xl text-xs font-semibold">
                    <button type="button" onclick="startCameraScanner()" class="bg-red-600 text-white px-3 py-2 rounded-xl text-xs font-bold shadow">
                        📷 स्कैन
                    </button>
                </div>
            </div>

            <!-- कैमरा व्यू बॉक्स -->
            <div id="reader-container" class="hidden-section bg-black p-3 rounded-2xl border border-red-500 relative">
                <div id="reader" class="w-full rounded-xl overflow-hidden"></div>
                <button type="button" onclick="stopCameraScanner()" class="mt-2 w-full py-2 bg-red-600 text-white font-bold rounded-xl text-xs">
                    स्कैनर बंद करें ✕
                </button>
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">उत्पाद की फोटो (कैमरा या गैलरी)</label>
                <input type="file" id="p-image" accept="image/*" class="w-full text-xs text-gray-500 file:mr-2 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-red-50 file:text-red-700 hover:file:bg-red-100">
            </div>

            <button type="submit" class="w-full py-3.5 bg-green-600 hover:bg-green-700 text-white font-black rounded-xl text-xs shadow mt-2">
                + डेटाबेस में सेव करें
            </button>
        </form>
    </div>

    <script>
        let html5QrCode = null;

        function startCameraScanner() {
            document.getElementById('reader-container').classList.remove('hidden-section');
            if (html5QrCode) { stopCameraScanner(); }
            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: { width: 250, height: 150 } }, 
                (decodedText) => {
                    document.getElementById('p-code').value = decodedText;
                    stopCameraScanner();
                },
                (err) => {}
            ).catch(err => { alert("कैमरा परमिशन दें!"); document.getElementById('reader-container').classList.add('hidden-section'); });
        }

        function stopCameraScanner() {
            if (html5QrCode) {
                html5QrCode.stop().then(() => { html5QrCode.clear(); html5QrCode = null; }).catch(() => { html5QrCode = null; });
            }
            document.getElementById('reader-container').classList.add('hidden-section');
        }

        function saveProduct(e) {
            e.preventDefault();
            let name = document.getElementById('p-name').value.trim();
            let model = document.getElementById('p-model').value.trim();
            let price = parseInt(document.getElementById('p-price').value);
            let code = document.getElementById('p-code').value.trim();
            let fileInput = document.getElementById('p-image');

            let masterProducts = JSON.parse(localStorage.getItem('jvg_master_products')) || [
                { name: "PVC Identity Card Print", model: "PVC-01", price: 50, code: "890101" },
                { name: "Ajanta LED Bulb 12W", model: "AJ-12W", price: 120, code: "890102" },
                { name: "boAt Neckband BT-101", model: "BT-101", price: 650, code: "890103" }
            ];

            let newProd = { name: name, model: model, price: price, code: code };

            if (fileInput.files && fileInput.files[0]) {
                let reader = new FileReader();
                reader.onload = function(evt) {
                    newProd.image = evt.target.result;
                    masterProducts.unshift(newProd);
                    localStorage.setItem('jvg_master_products', JSON.stringify(masterProducts));
                    alert('उत्पाद सफलतापूर्वक सेव हो गया! OK ');
                    window.location.href = 'biling.html';
                };
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                masterProducts.unshift(newProd);
                localStorage.setItem('jvg_master_products', JSON.stringify(masterProducts));
                alert('उत्पाद सफलतापूर्वक सेव हो गया!');
                window.location.href = 'biling.html';
            }
        }
    </script>
</body>
</html>
