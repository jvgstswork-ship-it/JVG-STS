<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JVG STS - Product Upload & Manage</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        .hidden-section { display: none !important; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-4 font-sans pb-20">
    <div class="max-w-md mx-auto space-y-5">
        
        <!-- Product Add/Edit Form -->
        <div class="bg-white p-5 rounded-3xl shadow-xl border space-y-4">
            <div class="flex justify-between items-center border-b pb-3">
                <h2 id="form-title" class="font-black text-red-600 text-sm flex items-center gap-1">
                    <span>📦 नया प्रोडक्ट अपलोड करें</span>
                </h2>
                <a href="biling.html" class="bg-red-600 hover:bg-red-700 text-white font-bold text-xs px-3 py-1.5 rounded-xl shadow">
                    🏠 होम (बिलिंग)
                </a>
            </div>

            <form id="upload-form" onsubmit="saveProduct(event)" class="space-y-3">
                <input type="hidden" id="edit-index" value="-1">
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">सामान का नाम</label>
                    <input type="text" id="p-name" placeholder="उदा. boAt Neckband" required class="w-full p-2.5 border rounded-xl text-xs font-semibold">
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">मॉडल नंबर</label>
                        <input type="text" id="p-model" placeholder="उदा. BT-101" required class="w-full p-2.5 border rounded-xl text-xs font-semibold">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">बिक्री रेट (₹)</label>
                        <input type="number" id="p-price" placeholder="650" required class="w-full p-2.5 border rounded-xl text-xs font-semibold">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">स्टॉक मात्रा (कुल पीस)</label>
                    <input type="number" id="p-stock" placeholder="10" min="0" value="10" required class="w-full p-2.5 border rounded-xl text-xs font-bold text-green-700 bg-green-50">
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">बारकोड नंबर</label>
                    <div class="flex gap-2">
                        <input type="text" id="p-code" placeholder="उदा. 890123456" required class="flex-1 p-2.5 border rounded-xl text-xs font-semibold">
                        <button type="button" onclick="startCameraScanner()" class="bg-purple-600 hover:bg-purple-700 text-white px-3 py-2 rounded-xl text-xs font-bold shadow">
                            📷 स्कैन
                        </button>
                    </div>
                </div>

                <div id="reader-container" class="hidden-section bg-black p-3 rounded-2xl border border-red-500 relative">
                    <div id="reader" class="w-full rounded-xl overflow-hidden"></div>
                    <button type="button" onclick="stopCameraScanner()" class="mt-2 w-full py-2 bg-red-600 text-white font-bold rounded-xl text-xs">
                        स्कैनर बंद करें ✕
                    </button>
                </div>

                <button type="submit" id="submit-btn" class="w-full py-3.5 bg-green-600 hover:bg-green-700 text-white font-black rounded-xl text-xs shadow">
                    + डेटाबेस में सेव करें
                </button>
            </form>
        </div>

        <!-- Product List & Manage Section -->
        <div class="bg-white p-5 rounded-3xl shadow-xl border space-y-3">
            <h3 class="font-black text-gray-800 text-xs border-b pb-2 flex justify-between items-center">
                <span>📋 मौजूद सामानों की सूची (Manage Products)</span>
                <span id="product-count" class="bg-red-100 text-red-600 text-[10px] px-2 py-0.5 rounded-full font-bold">0</span>
            </h3>

            <div id="manage-products-list" class="space-y-2 max-h-60 overflow-y-auto pr-1">
                <!-- Products list -->
            </div>
        </div>

    </div>

    <script>
        let html5QrCode = null;

        window.onload = function() {
            renderManageProducts();
        };

        function startCameraScanner() {
            document.getElementById('reader-container').classList.remove('hidden-section');
            if (html5QrCode) { stopCameraScanner(); }
            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: { width: 250, height: 150 } }, 
                (decodedText) => {
                    document.getElementById('p-code').value = decodedText;
                    stopCameraScanner();
                },
                (err) => {}
            ).catch(err => { alert("कैमरा परमिशन दें!"); document.getElementById('reader-container').classList.add('hidden-section'); });
        }

        function stopCameraScanner() {
            if (html5QrCode) {
                html5QrCode.stop().then(() => { html5QrCode.clear(); html5QrCode = null; }).catch(() => { html5QrCode = null; });
            }
            document.getElementById('reader-container').classList.add('hidden-section');
        }

        function getProducts() {
            try {
                return JSON.parse(localStorage.getItem('jvg_master_products')) || [
                    { name: "Ajanta LED Bulb 12W", model: "AJ-12W", price: 120, code: "890102", stock: 5, category: "Electronics" },
                    { name: "boAt Neckband BT-101", model: "BT-101", price: 650, code: "890103", stock: 3, category: "Electronics" },
                    { name: "PVC Identity Card Print", model: "PVC-01", price: 50, code: "890101", stock: 22, category: "Digital" }
                ];
            } catch(e) { return []; }
        }

        function renderManageProducts() {
            let products = getProducts();
            let countBox = document.getElementById('product-count');
            if(countBox) countBox.innerText = products.length;
            let box = document.getElementById('manage-products-list');
            if(!box) return;
            box.innerHTML = '';

            if (products.length === 0) {
                box.innerHTML = '<p class="text-xs text-gray-400 text-center py-2">कोई प्रोडक्ट मौजूद नहीं है</p>';
                return;
            }

            products.forEach((p, index) => {
                box.innerHTML += `
                    <div class="flex justify-between items-center bg-gray-50 p-2.5 rounded-xl border text-xs">
                        <div>
                            <p class="font-bold text-gray-800">${p.name} (${p.model || ''})</p>
                            <p class="text-[10px] text-gray-500">रेट: ₹${p.price} | स्टॉक: ${p.stock || 10} पीस</p>
                        </div>
                        <div class="flex gap-1">
                            <button type="button" onclick="editProduct(${index})" class="bg-blue-500 hover:bg-blue-600 text-white text-[10px] px-2 py-1.5 rounded-lg font-bold shadow">
                                ✏️ एडिट
                            </button>
                            <button type="button" onclick="deleteProduct('${p.code}')" class="bg-red-500 hover:bg-red-600 text-white text-[10px] px-2 py-1.5 rounded-lg font-bold shadow">
                                🗑️ हटाएं
                            </button>
                        </div>
                    </div>
                `;
            });
        }

        function saveProduct(e) {
            e.preventDefault();
            let name = document.getElementById('p-name').value.trim();
            let model = document.getElementById('p-model').value.trim();
            let price = parseInt(document.getElementById('p-price').value) || 0;
            let stock = parseInt(document.getElementById('p-stock').value) || 10;
            let code = document.getElementById('p-code').value.trim();
            let editIdx = parseInt(document.getElementById('edit-index').value);

            let masterProducts = getProducts();

            if (editIdx > -1) {
                // Update existing
                masterProducts[editIdx] = { ...masterProducts[editIdx], name, model, price, stock, code };
                alert('उत्पाद सफलतापूर्वक अपडेट हो गया!');
                document.getElementById('edit-index').value = -1;
                document.getElementById('form-title').innerText = '📦 नया प्रोडक्ट अपलोड करें';
                document.getElementById('submit-btn').innerText = '+ डेटाबेस में सेव करें';
            } else {
                // Add new
                let exists = masterProducts.find(x => x.code === code);
                if (exists) {
                    alert("यह बारकोड पहले से मौजूद है!");
                    return;
                }
                masterProducts.unshift({ name, model, price, stock, code, category: "Electronics" });
                alert('उत्पाद सफलतापूर्वक सेव हो गया!');
            }

            localStorage.setItem('jvg_master_products', JSON.stringify(masterProducts));
            document.getElementById('upload-form').reset();
            renderManageProducts();
        }

        function editProduct(index) {
            let products = getProducts();
            let p = products[index];
            document.getElementById('p-name').value = p.name;
            document.getElementById('p-model').value = p.model || '';
            document.getElementById('p-price').value = p.price;
            document.getElementById('p-stock').value = p.stock || 10;
            document.getElementById('p-code').value = p.code;
            document.getElementById('edit-index').value = index;
            
            document.getElementById('form-title').innerText = '✏️ प्रोडक्ट एडिट करें';
            document.getElementById('submit-btn').innerText = '✓ अपडेट करें';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function deleteProduct(code) {
            if (confirm("क्या आप सच में इस प्रोडक्ट को हटाना चाहते हैं?")) {
                let masterProducts = getProducts();
                masterProducts = masterProducts.filter(p => p.code !== code);
                localStorage.setItem('jvg_master_products', JSON.stringify(masterProducts));
                renderManageProducts();
                alert("उत्पाद हटा दिया गया!");
            }
        }
    </script>
</body>
</html>
