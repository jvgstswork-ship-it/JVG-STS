<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JVG STS - Sales History</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4">
    <div class="max-w-md mx-auto bg-white p-6 rounded-2xl shadow border space-y-4">
        <div class="flex justify-between items-center border-b pb-2">
            <h3 class="font-black text-gray-800 text-sm">📜 बिक्री का इतिहास (History)</h3>
            <a href="billing.html" class="text-xs bg-gray-200 px-3 py-1 rounded font-bold">← बिलिंग पर जाएं</a>
        </div>

        <div class="bg-red-50 p-3 rounded-xl border border-red-200 text-center">
            <p class="text-xs font-bold text-red-600">आज की कुल बिक्री</p>
            <h2 class="text-2xl font-black text-red-700">₹<span id="total-sales-display">0</span></h2>
        </div>

        <div id="history-box" class="space-y-2 max-h-96 overflow-y-auto text-xs">
            <p class="text-gray-400 text-center py-4">कोई रिकॉर्ड नहीं मिला</p>
        </div>
    </div>

    <script>
        window.onload = function() {
            let total = localStorage.getItem('jvg_today_sales') || '0';
            document.getElementById('total-sales-display').innerText = total;

            let history = JSON.parse(localStorage.getItem('jvg_sales_history')) || [];
            let box = document.getElementById('history-box');
            if(history.length === 0) return;

            box.innerHTML = '';
            history.forEach(h => {
                box.innerHTML += `<div class="flex justify-between items-center bg-gray-50 p-2.5 rounded-xl border">
                    <div>
                        <p class="font-bold text-gray-800">₹${h.amount} <span class="text-[10px] text-gray-500">(${h.seller})</span></p>
                        <p class="text-[10px] text-gray-500">समय: ${h.time}</p>
                    </div>
                    <span class="text-[10px] bg-green-100 text-green-700 px-2 py-0.5 rounded font-bold">सफल ✓</span>
                </div>`;
            });
        }
    </script>
</body>
</html>
