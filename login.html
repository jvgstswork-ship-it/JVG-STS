<!-- लॉगिन सेक्शन -->
<div id="login-container" class="max-w-md mx-auto my-10 p-6 bg-white/90 backdrop-blur rounded-2xl shadow-xl border border-red-100">
    <div class="text-center mb-6">
        <div class="w-16 h-16 bg-red-600 text-white rounded-full flex items-center justify-center mx-auto mb-2 text-xl font-black shadow-md">STS</div>
        <h1 class="text-xl font-black text-red-600 tracking-tight">JVG SmartTech Suvidha</h1>
        <p class="text-xs text-gray-500 font-medium">गौरा दुबे, सिसवा बाज़ार, महराजगंज (UP)</p>
    </div>

    <form id="login-form" class="space-y-4" onsubmit="handleLogin(event)">
        <div>
            <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1">रोल चुनें</label>
            <select id="login-role" class="w-full p-3 border border-gray-300 rounded-xl text-sm font-semibold">
                <option value="owner">मालिक (Owner)</option>
                <option value="staff">स्टाफ (Staff Operator)</option>
            </select>
        </div>
        <div>
            <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1">मोबाइल नंबर</label>
            <input type="tel" id="login-id" placeholder="7518314203" required class="w-full p-3 border border-gray-300 rounded-xl text-sm font-semibold">
        </div>
        <div>
            <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1">पासवर्ड</label>
            <input type="password" id="login-pass" placeholder="XXXX" required class="w-full p-3 border border-gray-300 rounded-xl text-sm font-semibold">
        </div>
        <div class="flex justify-between items-center text-xs">
            <span class="text-gray-500 font-medium">ओनर पास: <strong class="text-red-600">7518314203</strong></span>
            <button type="button" onclick="forgotPassword()" class="text-red-600 font-bold hover:underline">पासवर्ड भूल गए? 🤔</button>
        </div>
        <button type="submit" class="w-full py-3.5 bg-gradient-to-r from-red-600 to-red-700 text-white font-black rounded-xl shadow-lg text-sm">लॉगिन करें</button>
    </form>
</div>

<script>
    function forgotPassword() {
        const role = document.getElementById('login-role').value;
        if (role === 'owner') {
            alert("ओनर (मालिक) का पासवर्ड आपका मोबाइल नंबर है: 7518314203");
            document.getElementById('login-id').value = "7518314203";
            document.getElementById('login-pass').value = "7518314203";
        } else {
            alert("स्टाफ का पासवर्ड संबंधित स्टाफ के मोबाइल नंबर से जुड़ा है।");
        }
    }
</script>
